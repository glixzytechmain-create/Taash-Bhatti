    <!-- Foundational Restaurant Brand Schema (JSON-LD) -->
    <script type="application/ld+json" id="taash-bhatti-brand-schema">
    {
      "@context": "https://schema.org",
      "@type": "Restaurant",
      "name": "Taash Bhatti",
      "alternateName": "Taash Bhatti Authentic Woodfire Restaurant & Feasts",
      "description": "Authentic woodfire clay-oven restaurant chain offering royal handi dum feasts, charcoal kebabs, tandoori specialties, full dine-in table service, takeaway, and warm doorstep delivery.",
      "servesCuisine": ["North Indian", "Tandoori", "Mughlai", "Biryani", "Clay Oven Specialities"],
      "priceRange": "₹₹",
      "acceptsReservations": "True",
      "hasMenu": {
        "@type": "Menu",
        "name": "Taash Bhatti Royal Menu",
        "hasMenuSection": [
          {
            "@type": "MenuSection",
            "name": "Woodfire Clay-Oven Specialties",
            "description": "Handcrafted tandoori platters and charcoal smoked kebabs"
          },
          {
            "@type": "MenuSection",
            "name": "Handi Dum Feasts",
            "description": "Traditional clay handi slow-cooked curries and biryanis"
          }
        ]
      },
      "potentialAction": [
        {
          "@type": "ReserveAction",
          "result": {
            "@type": "FoodEstablishmentReservation",
            "name": "Table Dine-In Reservation"
          }
        },
        {
          "@type": "OrderAction",
          "deliveryMethod": [
            "http://purl.org/goodrelations/v1#DeliveryModePickUp",
            "http://purl.org/goodrelations/v1#DeliveryModeOwnFleet"
          ]
        }
      ]
    }
    </script>
